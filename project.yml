name: Larder
options:
  bundleIdPrefix: app.fornace
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2V6YSU4HFB
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Larder:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Larder
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fornace.larder
        PRODUCT_NAME: Larder
        INFOPLIST_KEY_CFBundleDisplayName: Larder
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Larder uses the camera to scan pantry items and shelf labels.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Larder syncs your shopping list with its Mac app.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Larder/Larder-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Larder/Larder-macOS.entitlements
        SUPPORTS_MACCATALYST: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - target: LarderWidgets
        embed: true

  LarderWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fornace.larder.widgets
        PRODUCT_NAME: LarderWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Widgets/LarderWidgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Widgets/LarderWidgets-macOS.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Larder:
    build:
      targets:
        Larder: all
        LarderWidgets: all
    run:
      config: Debug
    archive:
      config: Release
